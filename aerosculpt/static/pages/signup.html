<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account — AeroSculpt</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/theme-init.js"></script>
</head>
<body data-page="signup">
<main class="auth-wrap"><div class="card pad-lg auth-card">
  <h1>Start for free</h1><p>The Lite plan is free forever. Upgrade or start a Pro trial whenever you like.</p>
  <form novalidate>
    <div id="form-error" class="notice bad hidden" style="margin-bottom:14px"></div>
    <label class="field"><span>Name</span><input type="text" name="name" autocomplete="name" maxlength="80"></label>
    <label class="field"><span>Work email</span><input type="email" name="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="10" required>
      <div class="small muted" style="margin-top:5px">At least 10 characters, with a number, symbol or capital.</div></label>
    <label class="check" style="margin-bottom:16px"><input type="checkbox" name="accept_terms" value="1" required>
      <span>I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</span></label>
    <button class="btn primary block" type="submit">Create account</button>
    <p class="small" style="margin:14px 0 0">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</div></main>
<script type="module" src="/static/js/auth.js"></script>
</body></html>
