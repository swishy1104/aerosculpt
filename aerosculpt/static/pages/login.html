<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — AeroSculpt</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/theme-init.js"></script>
</head>
<body data-page="login">
<main class="auth-wrap"><div class="card pad-lg auth-card">
  <h1>Welcome back</h1><p>Sign in to your projects and wind-tunnel runs.</p>
  <form novalidate>
    <div id="form-error" class="notice bad hidden" style="margin-bottom:14px"></div>
    <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required autofocus></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Sign in</button>
    <p class="small" style="margin:14px 0 0;display:flex;justify-content:space-between"><a href="/forgot">Forgot password?</a><a href="/signup">Create an account</a></p>
  </form>
</div></main>
<script type="module" src="/static/js/auth.js"></script>
</body></html>
