# Builds the Windows desktop app on a clean machine (no Anaconda, no CUDA), runs its self-check
# and the API tests there, and publishes the zip on a version tag. The GPU pack is built from a
# machine with the CUDA wheels installed (scripts/build_desktop.py --gpu-pack).
name: desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write          # the Release step creates the release and uploads the zip
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Tests on the CPU
        run: python -m pytest -q -x tests/test_rocket.py tests/test_api.py tests/test_design.py
        env:
          AEROSCULPT_GPU: "0"
      - name: Build (CPU-only base app)
        run: python scripts/build_desktop.py --cpu-only --skip-tests
        env:
          SIGN_CMD: ${{ secrets.SIGN_CMD }}
      - name: Self-check on a clean machine
        run: dist\AeroSculpt\AeroSculpt.exe --check
      - name: Serve and answer a request
        shell: pwsh
        run: |
          $env:AEROSCULPT_NO_BROWSER = "1"
          $p = Start-Process -FilePath dist\AeroSculpt\AeroSculpt.exe -PassThru -RedirectStandardOutput exe.log -RedirectStandardError exe.err
          # the launch link is printed (and flushed) as soon as the app starts; the server itself logs to stderr
          $url = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            if (Test-Path exe.log) {
              $m = Select-String -Path exe.log -Pattern "open\s+(http\S+)"
              if ($m) { $url = $m.Matches[0].Groups[1].Value; break }
            }
            if ($p.HasExited) { break }
          }
          if (-not $url) {
            if (Test-Path exe.log) { Get-Content exe.log }; if (Test-Path exe.err) { Get-Content exe.err }
            throw "the app printed no launch link within 120 s"
          }
          Write-Host "launch link: $url"
          $code = "000"
          foreach ($i in 1..90) {
            $code = & curl.exe -s -o NUL -w "%{http_code}" "$url"
            if ($code -ne "000") { break }
            Start-Sleep -Seconds 2
          }
          if (Test-Path exe.log) { Get-Content exe.log }; if (Test-Path exe.err) { Get-Content exe.err }
          Write-Host "launch link answered $code (302 = sets the launch cookie)"
          $health = & curl.exe -s -o NUL -w "%{http_code}" ($url.Substring(0, $url.IndexOf("/app")) + "/api/health")
          Write-Host "API without the launch cookie answered $health (401 = guarded)"
          Stop-Process -Id $p.Id -Force
          if ($code -ne "302") { throw "launch link did not answer as expected: $code" }
      - uses: actions/upload-artifact@v4
        with:
          name: AeroSculpt-windows
          path: |
            dist/AeroSculpt-*-windows.zip
            dist/AeroSculpt-Setup-*.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AeroSculpt-*-windows.zip
            dist/AeroSculpt-Setup-*.exe
          generate_release_notes: true
